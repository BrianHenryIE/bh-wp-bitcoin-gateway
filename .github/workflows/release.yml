name: Attach tested plugin archive to release

# Attaches the built plugin zip to the GitHub release — specifically the zip that the E2E tests
# ran against, never a fresh untested build:
#
# * If the tagged commit already has a successful E2E workflow run, its plugin-archive artifact is
#   downloaded and attached.
# * Otherwise the whole E2E workflow (build + Playwright matrix) runs here on the tag, and the zip
#   it built and tested is attached.
#
# The release tag must match the version in the plugin's base file, since the zip filename carries
# that version.
#
# @author BrianHenryIE

on:
  release:
    types: [published]

jobs:

  # Prefer the zip already tested on this commit.
  find-tested-build:
    name: Find prior successful E2E run
    runs-on: ubuntu-latest

    outputs:
      run-id: ${{ steps.find.outputs.run-id }}

    steps:

      - name: Checkout the tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Look up E2E runs for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$RUN_ID" ]; then
            echo "Found successful E2E run $RUN_ID for $SHA"
          else
            echo "No successful E2E run found for $SHA; the E2E workflow will run now."
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  # No prior successful run → build and test this tag now, reusing the whole E2E workflow.
  # Its plugin-archive artifact lands in this workflow run.
  e2e:
    name: E2E
    needs: find-tested-build
    if: ${{ needs.find-tested-build.outputs.run-id == '' }}
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  attach:
    name: Attach archive to release
    runs-on: ubuntu-latest
    needs: [ find-tested-build, e2e ]
    # e2e is skipped when a prior tested artifact exists; anything else must have succeeded.
    if: ${{ !cancelled() && needs.find-tested-build.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.e2e.result) }}

    permissions:
      # `gh release upload`.
      contents: write
      # `gh run download` from another workflow run.
      actions: read

    steps:

      - name: Download previously tested archive
        if: ${{ needs.find-tested-build.outputs.run-id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.find-tested-build.outputs.run-id }}" --repo "${{ github.repository }}" --name plugin-archive --dir dist-archive \
            || { echo "::error::plugin-archive artifact expired. Dispatch the E2E workflow on this tag, then re-run this job."; exit 1; }

      - name: Download archive built by this run
        if: ${{ needs.find-tested-build.outputs.run-id == '' }}
        uses: actions/download-artifact@v7
        with:
          name: plugin-archive
          path: dist-archive

      - name: Verify archive version matches the tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          ls dist-archive/*"${TAG#v}"*.zip \
            || { echo "::error::No zip matching version ${TAG#v} in the tested artifact. Was the plugin version bumped before tagging?"; exit 1; }

      - name: Attach archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-archive/*.zip --clobber

#      - name: Unzip release archive for SVN deployment
